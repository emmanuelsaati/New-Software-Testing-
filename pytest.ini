[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    forms: marks tests as forms module tests
    widgets: marks tests as widgets module tests
    interactions: marks tests as interactions module tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    positive: marks tests as positive scenario tests
    negative: marks tests as negative scenario tests
    edge: marks tests as edge case tests
